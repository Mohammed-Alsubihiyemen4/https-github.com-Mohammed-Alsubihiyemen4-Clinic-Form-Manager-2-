openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Clinic Forms Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: training-certificates
    description: Training certificate management
  - name: medical-reports
    description: Medical report management
  - name: invoices
    description: Cash invoice management
  - name: customers
    description: Customer management
  - name: doctors
    description: Doctor management
  - name: users
    description: User management
  - name: settings
    description: System settings
  - name: audit-logs
    description: Audit log operations
  - name: dashboard
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ────────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity across all forms
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── TRAINING CERTIFICATES ────────────────────────────────────────────────────
  /training-certificates:
    get:
      operationId: listTrainingCertificates
      tags: [training-certificates]
      summary: List all training certificates
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: archived
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of training certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingCertificate"
    post:
      operationId: createTrainingCertificate
      tags: [training-certificates]
      summary: Create a training certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingCertificateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingCertificate"

  /training-certificates/{id}:
    get:
      operationId: getTrainingCertificate
      tags: [training-certificates]
      summary: Get a training certificate by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Training certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingCertificate"
        "404":
          description: Not found
    patch:
      operationId: updateTrainingCertificate
      tags: [training-certificates]
      summary: Update a training certificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingCertificateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingCertificate"
    delete:
      operationId: deleteTrainingCertificate
      tags: [training-certificates]
      summary: Archive a training certificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Archived

  /training-certificates/{id}/restore:
    patch:
      operationId: restoreTrainingCertificate
      tags: [training-certificates]
      summary: Restore an archived training certificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingCertificate"

  # ─── MEDICAL REPORTS ──────────────────────────────────────────────────────────
  /medical-reports:
    get:
      operationId: listMedicalReports
      tags: [medical-reports]
      summary: List all medical reports
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: doctorId
          in: query
          schema:
            type: integer
        - name: archived
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of medical reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicalReport"
    post:
      operationId: createMedicalReport
      tags: [medical-reports]
      summary: Create a medical report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicalReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalReport"

  /medical-reports/{id}:
    get:
      operationId: getMedicalReport
      tags: [medical-reports]
      summary: Get a medical report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Medical report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalReport"
        "404":
          description: Not found
    patch:
      operationId: updateMedicalReport
      tags: [medical-reports]
      summary: Update a medical report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicalReportUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalReport"
    delete:
      operationId: deleteMedicalReport
      tags: [medical-reports]
      summary: Archive a medical report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Archived

  /medical-reports/{id}/restore:
    patch:
      operationId: restoreMedicalReport
      tags: [medical-reports]
      summary: Restore an archived medical report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalReport"

  # ─── INVOICES ─────────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: integer
        - name: archived
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Archive an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Archived

  /invoices/{id}/restore:
    patch:
      operationId: restoreInvoice
      tags: [invoices]
      summary: Restore an archived invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  # ─── CUSTOMERS ────────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── DOCTORS ──────────────────────────────────────────────────────────────────
  /doctors:
    get:
      operationId: listDoctors
      tags: [doctors]
      summary: List all doctors
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"
    post:
      operationId: createDoctor
      tags: [doctors]
      summary: Create a doctor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"

  /doctors/{id}:
    get:
      operationId: getDoctor
      tags: [doctors]
      summary: Get a doctor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "404":
          description: Not found
    patch:
      operationId: updateDoctor
      tags: [doctors]
      summary: Update a doctor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
    delete:
      operationId: deleteDoctor
      tags: [doctors]
      summary: Delete a doctor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── USERS ────────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── SETTINGS ─────────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get system settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update system settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  # ─── AUDIT LOGS ───────────────────────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: List audit logs
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: formType
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── DASHBOARD ──────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [trainingCertificates, medicalReports, invoices, totalInvoiceAmount, todayCount]
      properties:
        trainingCertificates:
          type: integer
        medicalReports:
          type: integer
        invoices:
          type: integer
        totalInvoiceAmount:
          type: number
        todayCount:
          type: integer
        lastTrainingCertificate:
          type: ["string", "null"]
        lastMedicalReport:
          type: ["string", "null"]
        lastInvoice:
          type: ["string", "null"]

    ActivityItem:
      type: object
      required: [id, formType, formNumber, action, createdAt]
      properties:
        id:
          type: integer
        formType:
          type: string
        formNumber:
          type: string
        action:
          type: string
        userName:
          type: ["string", "null"]
        createdAt:
          type: string

    # ─── TRAINING CERTIFICATE ───────────────────────────────────────────────────
    TrainingCertificate:
      type: object
      required: [id, certificateNumber, traineeName, gender, department, startDate, endDate, issuedAt, isArchived, createdAt]
      properties:
        id:
          type: integer
        certificateNumber:
          type: string
        traineeName:
          type: string
        gender:
          type: string
          enum: [male, female]
        department:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        trainingOrg:
          type: ["string", "null"]
        issuedAt:
          type: string
        isArchived:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    TrainingCertificateInput:
      type: object
      required: [traineeName, gender, department, startDate, endDate]
      properties:
        traineeName:
          type: string
          minLength: 1
        gender:
          type: string
          enum: [male, female]
        department:
          type: string
          minLength: 1
        startDate:
          type: string
        endDate:
          type: string
        trainingOrg:
          type: string

    TrainingCertificateUpdate:
      type: object
      properties:
        traineeName:
          type: string
          minLength: 1
        gender:
          type: string
          enum: [male, female]
        department:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        trainingOrg:
          type: string

    # ─── MEDICAL REPORT ─────────────────────────────────────────────────────────
    MedicalReport:
      type: object
      required: [id, reportNumber, patientName, age, gender, diagnosis, reportText, reportDate, isArchived, createdAt]
      properties:
        id:
          type: integer
        reportNumber:
          type: string
        patientName:
          type: string
        age:
          type: integer
        gender:
          type: string
          enum: [male, female]
        diagnosis:
          type: string
        reportText:
          type: string
        doctorId:
          type: ["integer", "null"]
        doctorName:
          type: ["string", "null"]
        doctorSpecialty:
          type: ["string", "null"]
        reportDate:
          type: string
        isArchived:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    MedicalReportInput:
      type: object
      required: [patientName, age, gender, diagnosis, reportText, reportDate]
      properties:
        patientName:
          type: string
          minLength: 1
        age:
          type: integer
          minimum: 0
        gender:
          type: string
          enum: [male, female]
        diagnosis:
          type: string
          minLength: 1
        reportText:
          type: string
          minLength: 1
        doctorId:
          type: integer
        reportDate:
          type: string

    MedicalReportUpdate:
      type: object
      properties:
        patientName:
          type: string
        age:
          type: integer
        gender:
          type: string
          enum: [male, female]
        diagnosis:
          type: string
        reportText:
          type: string
        doctorId:
          type: integer
        reportDate:
          type: string

    # ─── INVOICE ────────────────────────────────────────────────────────────────
    Invoice:
      type: object
      required: [id, invoiceNumber, invoiceDate, totalAmount, isArchived, createdAt, items]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerCode:
          type: ["string", "null"]
        branch:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        collector:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        subtotal:
          type: number
        discount:
          type: number
        totalAmount:
          type: number
        isArchived:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"

    InvoiceItem:
      type: object
      required: [id, invoiceId, itemCode, itemName, unit, quantity, price, total]
      properties:
        id:
          type: integer
        invoiceId:
          type: integer
        itemCode:
          type: string
        itemName:
          type: string
        unit:
          type: string
        quantity:
          type: number
        bonus:
          type: number
        price:
          type: number
        total:
          type: number

    InvoiceInput:
      type: object
      required: [invoiceDate, items]
      properties:
        invoiceDate:
          type: string
        customerId:
          type: integer
        branch:
          type: string
        section:
          type: string
        department:
          type: string
        collector:
          type: string
        notes:
          type: string
        discount:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItemInput"

    InvoiceItemInput:
      type: object
      required: [itemCode, itemName, unit, quantity, price]
      properties:
        itemCode:
          type: string
        itemName:
          type: string
        unit:
          type: string
        quantity:
          type: number
        bonus:
          type: number
        price:
          type: number

    InvoiceUpdate:
      type: object
      properties:
        invoiceDate:
          type: string
        customerId:
          type: integer
        branch:
          type: string
        section:
          type: string
        department:
          type: string
        collector:
          type: string
        notes:
          type: string
        discount:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItemInput"

    # ─── CUSTOMER ───────────────────────────────────────────────────────────────
    Customer:
      type: object
      required: [id, customerCode, name, createdAt]
      properties:
        id:
          type: integer
        customerCode:
          type: string
        name:
          type: string
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    CustomerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
        address:
          type: string
        notes:
          type: string

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        notes:
          type: string

    # ─── DOCTOR ─────────────────────────────────────────────────────────────────
    Doctor:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        specialty:
          type: ["string", "null"]
